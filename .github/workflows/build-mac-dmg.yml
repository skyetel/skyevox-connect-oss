name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built DMGs to the GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Build unsigned app bundles
        working-directory: electron
        run: npx electron-builder --mac dir --x64 --arm64 --config.mac.identity=null

      - name: Validate packaged main-process modules
        working-directory: electron
        shell: bash
        run: |
          set -euo pipefail
          for app in "dist/mac/SkyeVox Connect.app" "dist/mac-arm64/SkyeVox Connect.app"; do
            npx asar list "$app/Contents/Resources/app.asar" | grep -Fx '/security.js'
          done

      - name: Ad-hoc sign app bundles
        working-directory: electron
        shell: bash
        run: |
          set -euo pipefail
          sign_bundle() {
            local app="$1"
            python3 - "$app" <<'PY'
          import os
          import stat
          import subprocess
          import sys

          app = sys.argv[1]
          targets = set()

          for root, dirs, files in os.walk(app):
              for dirname in dirs:
                  path = os.path.join(root, dirname)
                  if dirname.endswith((".app", ".framework", ".xpc")):
                      targets.add(path)
              for filename in files:
                  path = os.path.join(root, filename)
                  try:
                      mode = os.stat(path).st_mode
                  except FileNotFoundError:
                      continue
                  if filename.endswith((".dylib", ".so", ".node")) or (mode & stat.S_IXUSR):
                      targets.add(path)

          for target in sorted(targets, key=lambda p: p.count(os.sep), reverse=True):
              subprocess.run(
                  ["codesign", "--force", "--sign", "-", "--timestamp=none", target],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )

          subprocess.run(
              ["codesign", "--force", "--deep", "--sign", "-", "--timestamp=none", app],
              check=True,
          )
          subprocess.run(["codesign", "--verify", "--deep", "--strict", "--verbose=4", app], check=True)
          PY
          }
          for app in "dist/mac/SkyeVox Connect.app" "dist/mac-arm64/SkyeVox Connect.app"; do
            sign_bundle "$app"
            codesign -dv --verbose=4 "$app" 2>&1 | grep -E "Authority|TeamIdentifier|Signature"
            codesign -dv --verbose=4 "$app/Contents/Frameworks/Electron Framework.framework" 2>&1 | grep -E "Authority|TeamIdentifier|Signature"
          done

      - name: Launch native macOS app bundle
        working-directory: electron
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" == "arm64" ]]; then
            app="dist/mac-arm64/SkyeVox Connect.app"
          else
            app="dist/mac/SkyeVox Connect.app"
          fi
          log="$RUNNER_TEMP/skyevox-connect-launch.log"
          "$app/Contents/MacOS/SkyeVox Connect" --disable-gpu >"$log" 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" >/dev/null 2>&1 || true
            wait "$pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          sleep 8
          if ! kill -0 "$pid" >/dev/null 2>&1; then
            cat "$log"
            wait "$pid"
            exit 1
          fi

      - name: Create DMGs
        working-directory: electron
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          rm -rf dist/dmg-root-x64 dist/dmg-root-arm64
          mkdir -p dist/dmg-root-x64 dist/dmg-root-arm64
          cp -R "dist/mac/SkyeVox Connect.app" "dist/dmg-root-x64/"
          cp -R "dist/mac-arm64/SkyeVox Connect.app" "dist/dmg-root-arm64/"
          ln -s /Applications "dist/dmg-root-x64/Applications"
          ln -s /Applications "dist/dmg-root-arm64/Applications"
          hdiutil create -volname "SkyeVox Connect x64" -srcfolder "dist/dmg-root-x64" -ov -format UDZO "dist/SkyeVoxConnect-v${version}-mac-x64.dmg"
          sync
          sleep 5
          hdiutil create -volname "SkyeVox Connect arm64" -srcfolder "dist/dmg-root-arm64" -ov -format UDZO "dist/SkyeVoxConnect-v${version}-mac-arm64.dmg"
          shasum -a 256 "dist/SkyeVoxConnect-v${version}-mac-x64.dmg" "dist/SkyeVoxConnect-v${version}-mac-arm64.dmg"

      - name: Publish DMGs to GitHub Release
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./electron/package.json').version")"
          tag="skyevox-connect-v${version}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "SkyeVox Connect v${version}" \
              --notes "SkyeVox Connect desktop release v${version}."
          fi
          gh release upload "$tag" electron/dist/SkyeVoxConnect-v*-mac-*.dmg --clobber
