name: iOS Build

on:
  push:
    branches: [ci/ios-unsigned-build]
  workflow_dispatch:
    inputs:
      lane:
        description: "Build lane: adhoc (OTA) or appstore (TestFlight/App Store upload)"
        type: choice
        options: [adhoc, appstore]
        default: adhoc

jobs:
  build-ios-unsigned:
    name: Build unsigned iOS app
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Archive (unsigned, generic iOS device)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee xcodebuild.log | xcbeautify --renderer github-actions || (tail -200 xcodebuild.log; exit 1)

      - name: Package unsigned IPA
        working-directory: ios/App
        run: |
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/*.app Payload/
          zip -qry SkyeVoxConnect-unsigned.ipa Payload
          ls -la SkyeVoxConnect-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SkyeVoxConnect-ios-unsigned
          path: ios/App/SkyeVoxConnect-unsigned.ipa
          retention-days: 14

  build-ios-signed:
    name: Build signed Ad Hoc IPA
    if: github.event_name == 'workflow_dispatch' && (inputs.lane == 'adhoc' || inputs.lane == '')
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Import signing certificate
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -e
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASS=$(uuidgen)
          echo "$DIST_CERT_P12_BASE64" | base64 -d > $RUNNER_TEMP/dist.p12
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import $RUNNER_TEMP/dist.p12 -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Fetch Ad Hoc provisioning profile
        run: |
          set -e
          python3 -m venv "$RUNNER_TEMP/ascvenv"
          "$RUNNER_TEMP/ascvenv/bin/pip" install -q PyJWT cryptography requests
          "$RUNNER_TEMP/ascvenv/bin/python" scripts/fetch-adhoc-profile.py

      - name: Set production push entitlement
        run: /usr/libexec/PlistBuddy -c "Set :aps-environment production" ios/App/App/App.entitlements

      - name: Configure manual signing (App target only)
        run: |
          python3 - <<EOF
          path = "ios/App/App.xcodeproj/project.pbxproj"
          s = open(path).read()
          assert "CODE_SIGN_STYLE = Automatic;" in s
          s = s.replace(
              "CODE_SIGN_STYLE = Automatic;",
              'CODE_SIGN_STYLE = Manual;\n'
              '\t\t\t\tDEVELOPMENT_TEAM = $APPLE_TEAM_ID;\n'
              '\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "SkyeVox AdHoc";\n'
              '\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Distribution";')
          open(path, "w").write(s)
          print("App target set to manual signing")
          EOF

      - name: Archive (signed)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            | tee xcodebuild.log | xcbeautify --renderer github-actions || (tail -200 xcodebuild.log; exit 1)

      - name: Export Ad Hoc IPA with OTA manifest
        working-directory: ios/App
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>TEAM_ID_PLACEHOLDER</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.skyetel.skyevoxconnect</key><string>SkyeVox AdHoc</string>
            </dict>
            <key>manifest</key>
            <dict>
              <key>appURL</key><string>https://skyevox.skyetel.ai/ios-install/SkyeVoxConnect.ipa</string>
              <key>displayImageURL</key><string>https://skyevox.skyetel.ai/ios-install/icon57.png</string>
              <key>fullSizeImageURL</key><string>https://skyevox.skyetel.ai/ios-install/icon512.png</string>
            </dict>
          </dict>
          </plist>
          EOF
          sed -i '' "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/" ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            | tee export.log | xcbeautify --renderer github-actions || (tail -100 export.log; exit 1)
          ls -la build/export

      - uses: actions/upload-artifact@v4
        with:
          name: SkyeVoxConnect-ios-adhoc
          path: |
            ios/App/build/export/*.ipa
            ios/App/build/export/manifest.plist
          retention-days: 30

  build-ios-appstore:
    name: Build and upload App Store build
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'appstore'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SKYEVOX_PROFILE_NAME: SkyeVox AppStore
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (App Store requires the iOS 26 SDK)
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Import signing certificate
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -e
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASS=$(uuidgen)
          echo "$DIST_CERT_P12_BASE64" | base64 -d > $RUNNER_TEMP/dist.p12
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import $RUNNER_TEMP/dist.p12 -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Fetch App Store provisioning profile
        run: |
          set -e
          python3 -m venv "$RUNNER_TEMP/ascvenv"
          "$RUNNER_TEMP/ascvenv/bin/pip" install -q PyJWT cryptography requests
          "$RUNNER_TEMP/ascvenv/bin/python" scripts/fetch-adhoc-profile.py

      - name: Set production push entitlement
        run: /usr/libexec/PlistBuddy -c "Set :aps-environment production" ios/App/App/App.entitlements

      - name: Configure manual signing (App target only)
        run: |
          python3 - <<PYEOF
          path = "ios/App/App.xcodeproj/project.pbxproj"
          s = open(path).read()
          assert "CODE_SIGN_STYLE = Automatic;" in s
          s = s.replace(
              "CODE_SIGN_STYLE = Automatic;",
              'CODE_SIGN_STYLE = Manual;\n'
              '\t\t\t\tDEVELOPMENT_TEAM = $APPLE_TEAM_ID;\n'
              '\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "SkyeVox AppStore";\n'
              '\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Distribution";')
          open(path, "w").write(s)
          print("App target set to manual App Store signing")
          PYEOF

      - name: Archive (signed)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            | tee xcodebuild.log | xcbeautify --renderer github-actions || (tail -200 xcodebuild.log; exit 1)

      - name: Export and upload to App Store Connect
        working-directory: ios/App
        run: |
          set -o pipefail
          echo "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          cat > ExportOptions.plist <<'EOP'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>TEAM_ID_PLACEHOLDER</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.skyetel.skyevoxconnect</key><string>SkyeVox AppStore</string>
            </dict>
          </dict>
          </plist>
          EOP
          sed -i '' "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/" ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee export.log | xcbeautify --renderer github-actions || (tail -120 export.log; exit 1)
          echo "Upload step completed"
